# do-harness.toml — sensor pack for this workspace.
#
# Every sensor is offline and deterministic: no network, no credentials. The two
# network-adjacent commands (`link_check`, `youtube_live`) run in `--dry-run` /
# fixture mode, so CI never depends on a live broadcast existing.
#
# With zero sensors `do-harness verify` exits 0 without running anything — a
# vacuous pass, not evidence. `--strict` plus `--evidence` is the only green
# worth trusting.
language = "generic"

[hooks]
# Keep pre-commit sub-second: docs-only changes must not pay for pytest.
pre-commit = ["skill-contract", "validate-smoke"]
# Empty = the full suite.
pre-push = []

[[sensors]]
name = "skill-contract"
argv = ["python3", "scripts/validate.py", "--root", ".", "--check", "all"]
when-changed = ["SKILL.md", "README.md", "evals/**", "references/**", "config/**"]

[[sensors]]
name = "validate-smoke"
argv = ["python3", "scripts/validate.py", "--check", "smoke-test"]
when-changed = ["scripts/validate.py", "tests/**"]

[[sensors]]
name = "runtime-eval"
argv = ["python3", "scripts/runtime_eval.py", "--root", "."]
when-changed = ["scripts/runtime_eval.py", "evals/**"]

[[sensors]]
name = "pytest"
argv = ["python3", "-m", "pytest", "tests/", "-q"]
when-changed = ["tests/**", "scripts/**"]

[[sensors]]
name = "live-gate"
argv = [
  "python3",
  "scripts/youtube_live.py",
  "--input",
  "tests/fixtures/youtube_live_candidates.json",
  "--now",
  "2026-09-14T09:00:00Z",
]
when-changed = ["scripts/youtube_live.py", "tests/fixtures/**"]

[[sensors]]
name = "retired-sources"
# Replaces `source-registry`, which could not fail and read an input CI does not
# have: `source_learning.py candidates` returns 0 on every branch, and its input
# `logs/run-log.jsonl` is gitignored, so in CI the file was absent and the
# sensor reported "no new source candidates found" and passed -- asserting
# nothing about anything. Locally it printed its findings prefixed `OK:`, so a
# quarantined domain read as a pass.
#
# This gate reads committed evidence, can fail, and covers the half the positive
# registry structurally cannot: a domain that is approved and no longer works.
# `config/sources.json` can say what is allowed; only this can say what was
# proven dead. The BBL's old host is the case -- corrected in the registry and in
# a prose note, and fetched anyway for months.
argv = ["python3", "scripts/check_retired_sources.py", "--root", "."]
when-changed = ["config/retired-sources.json", "config/sources.json", "scripts/fixtures.py", "references/approved-sources.md", "scripts/check_retired_sources.py"]

[[sensors]]
name = "link-gate"
argv = ["python3", "scripts/link_check.py", "--url", "https://www.youtube.com/@fiba/live", "--dry-run"]
when-changed = ["scripts/link_check.py"]

[[sensors]]
name = "link-inventory"
# The self-learning link-revalidation seam, as one command. `links.json` is named
# in `references/self-learning.md`'s loop table, in `SKILL.md` and in
# `link_check.py`'s own docstring, and nothing produced it — because the runtime
# recorded a link *nowhere*: `_event_fields` dropped it at the planner boundary
# and `description_for` wrote only `League:`/`Teams:`. The loop could not run even
# in principle. This pins the round trip that makes it runnable: a candidate's
# link, through the planner and the description writer, back out of the reader and
# into the inventory — plus coverage of all 22 approved domains, of which the page
# corpus reaches 4.
argv = ["python3", "-m", "pytest", "tests/test_link_inventory.py", "-q"]
when-changed = [
  "scripts/link_inventory.py",
  "scripts/stream_links.py",
  "scripts/calendar_io.py",
  "scripts/upsert_events.py",
  "config/sources.json",
  "tests/fixtures/link_inventory_events.json",
]

[[sensors]]
name = "version-sync"
argv = ["python3", "scripts/bump_version.py", "--check"]
when-changed = ["SKILL.md", "CHANGELOG.md"]

[[sensors]]
name = "upsert-plan"
argv = [
  "python3",
  "scripts/upsert_events.py",
  "--existing",
  "tests/fixtures/upsert_existing.json",
  "--candidates",
  "tests/fixtures/upsert_candidates.json",
]
when-changed = ["scripts/upsert_events.py", "scripts/verification.py", "tests/fixtures/**"]

[[sensors]]
name = "upsert-verdicts"
# The audit's verdicts, honoured by the planner. Two events would both be
# promoted without the ledger; with it, only the one the audit condemned is
# held. The `[WRONG]` prefix the policy table reads is written by nothing, so
# without this input the §17 hard requirement is unenforceable on the real path.
argv = [
  "python3",
  "scripts/upsert_events.py",
  "--existing",
  "tests/fixtures/upsert_verdict_existing.json",
  "--candidates",
  "tests/fixtures/upsert_verdict_candidates.json",
  "--verdicts",
  "tests/fixtures/upsert_verdicts.jsonl",
]
when-changed = ["scripts/upsert_events.py", "scripts/audit_events.py", "tests/fixtures/upsert_verdict*", "tests/fixtures/audit*", "tests/fixtures/synthesise*", "tests/fixtures/**"]

[[sensors]]
name = "candidates-recall"
argv = ["python3", "scripts/candidates.py", "recall", "--ledger", "tests/fixtures/candidates_ledger.jsonl"]
when-changed = ["scripts/candidates.py", "tests/fixtures/**"]

[[sensors]]
name = "recall-seam"
# `metrics.json` read `recall 0.000 (0/270)` on the telemetry branch every day
# and could only ever read that: `candidates.jsonl` has one writer (Phase 0,
# which only searches, so every row is `unverifiable`) and nothing appended the
# row saying what the run decided. This is the seam that fixes it, asserted over
# fixtures in the REAL shapes: the ledger looks like Phase 0 output (URL only,
# no `game_key`), the plan carries no `url`, and one page backs two games exactly
# as the 2026-09-26 Dyn run did. `candidates_ledger.jsonl` is hand-built with a
# `created` row, so the pre-existing sensor read 0.5 while production could only
# produce 0 — the fixture supplied the field the pipeline never wrote.
argv = ["python3", "-m", "pytest", "tests/test_recall_seam.py", "tests/test_recall_seam_wiring.py", "-q"]
when-changed = [
  "scripts/candidates.py",
  "scripts/upsert_events.py",
  ".github/workflows/runtime-daily.yml",
  "tests/fixtures/recall_seam_*",
  "tests/test_recall_seam.py",
  "tests/test_recall_seam_wiring.py",
]

[[sensors]]
name = "audit-verdict"
argv = [
  "python3",
  "scripts/audit_events.py",
  "--events",
  "tests/fixtures/audit_events.json",
  "--evidence",
  "tests/fixtures/audit_evidence.json",
  "--now",
  "2026-09-15T08:30:00Z",
]
when-changed = ["scripts/audit_events.py", "scripts/verification.py", "tests/fixtures/**"]

[[sensors]]
name = "event-ledger"
# The Phase 2 -> 3 seam, as one command. `events.jsonl` and `evidence.json` are
# the audit's documented inputs and nothing wrote them, so Phase 3 found its
# inputs absent on every run and did nothing. This is the round trip: the writer
# produces both files and `audit_events` returns a verdict from them.
argv = ["python3", "-m", "pytest", "tests/test_event_ledger.py", "-q"]
when-changed = [
  "scripts/event_ledger.py",
  "scripts/evidence.py",
  "scripts/audit_events.py",
  "scripts/calendar_io.py",
]

[[sensors]]
name = "run-outcomes"
# The self-learning loop's missing caller, as one command. `source_learning.py`
# implements `record`/`score`/`candidates`, and `references/self-learning.md`
# tells a reader to run `record` after every run — but nothing in `.github/`
# calls it, so `run-log.jsonl` was never created by CI, `score` exited 1 on the
# empty log and `candidates` read nothing. The writer existed; the caller did
# not. `record_run_outcomes.py` derives rows from the ledgers that already exist
# (candidates, fetch-attempts, rung-attempts, events) and hands them to the real
# `source_learning.mode_record`, writing to the telemetry worktree rather than
# gitignored `logs/`.
#
# This gate reads COMMITTED fixtures, not the branch: it re-derives from
# `tests/fixtures/run_outcomes_good/` and requires the stored `run-log.jsonl` to
# match, to contain a row for a blocked source and for a parked rung, and to be
# readable by `source_learning.discover_candidates`. The sibling fixtures
# (`run_outcomes_missing_blocked`, `run_outcomes_missing_rung`,
# `run_outcomes_absent`) each make it exit 1 — the log blind to the issue it
# exists to record, which is the defect in one line.
argv = ["python3", "scripts/record_run_outcomes.py", "check", "--ledgers", "tests/fixtures/run_outcomes_good"]
when-changed = [
  "scripts/record_run_outcomes.py",
  "scripts/source_learning.py",
  "tests/fixtures/run_outcomes_*",
]

[[sensors]]
name = "eval-synthesis"
argv = [
  "python3",
  "scripts/synthesise_eval_case.py",
  "--verdicts",
  "tests/fixtures/synthesise_verdicts.jsonl",
  "--dry-run",
]
when-changed = ["scripts/synthesise_eval_case.py", "tests/fixtures/**"]

[[sensors]]
name = "metrics"
# Fixture inputs, so this is offline and deterministic: the metric contract is
# checked without needing a telemetry branch to exist.
argv = [
  "python3",
  "scripts/metrics.py",
  "--candidates",
  "tests/fixtures/candidates_ledger.jsonl",
  "--fixtures",
  "tests/fixtures/league_fixtures.jsonl",
  "--audit",
  "tests/fixtures/synthesise_verdicts.jsonl",
  "--dry-run",
]
when-changed = ["scripts/metrics.py", "scripts/candidates.py", "tests/fixtures/**"]

[[sensors]]
name = "workflow-refs"
# Catches the class, not the instance: a workflow that names a missing file is a
# step that can never do its job, however it chooses to hide the exit code.
argv = ["python3", "scripts/check_workflow_refs.py", "--root", "."]
when-changed = [".github/workflows/**", "scripts/check_workflow_refs.py"]

[[sensors]]
name = "page-corpus"
# The stream-evidence gate is what stands between a rendered page and a calendar
# write. It is judged against real recorded pages, not invented strings, because
# the rule it replaced matched the word "live" inside a YouTube JS bundle.
argv = ["python3", "scripts/record_pages.py", "--check"]
when-changed = ["scripts/record_pages.py", "scripts/render_ladder.py", "tests/fixtures/pages/**"]

[[sensors]]
name = "feed-corpus"
# The recorded iCalendar corpus is what pins the BBL feed's SUMMARY format, and
# that format is a provider's output: the league writes its competition onto the
# first club name and leaves every DTSTART floating. `--check` re-derives the
# bytes AND asks the reader to parse them, because a hash proves *unchanged* and
# never proves *readable* — the first version of this corpus kept 7 events with
# no BEGIN/END envelope and this gate was green.
argv = ["python3", "scripts/record_feeds.py", "--check"]
when-changed = ["scripts/record_feeds.py", "scripts/fixtures.py", "tests/fixtures/feeds/**"]

[[sensors]]
name = "invariants-shape"
argv = ["python3", "-c", "import json; d=json.load(open('plans/invariants.json')); assert isinstance(d,list), 'invariants.json must be a bare array'"]
when-changed = ["plans/invariants.json"]

[[sensors]]
name = "product-contract"
# `PRODUCT.md` and `tasks.md` are committed documents, and a document nothing
# reads is decoration. This gate is what makes them claims instead of prose: the
# product contract may not name a sensor `do-harness.toml` does not declare
# (a promise guarded by a sensor that does not exist is a rule that has never
# run -- `plans/methods.json` still named `source-registry` after commit 01f8e77
# deleted it), every sensor an invariant relies on must be named in the
# contract's Sensor table, and `tasks.md` must match the `do-harness task
# export` it mirrors or the board has rotted. Each check is exercised by a
# fixture in `tests/fixtures/product/` that makes it fail for real.
argv = ["python3", "scripts/check_product_contract.py", "--root", "."]
when-changed = ["PRODUCT.md", "tasks.md", "plans/**", "do-harness.toml", "scripts/check_product_contract.py"]

[signal-sets]
feedback = ["skill-contract", "validate-smoke"]
verification = [
  "skill-contract",
  "validate-smoke",
  "runtime-eval",
  "pytest",
  "live-gate",
  "retired-sources",
  "invariants-shape",
  "workflow-refs",
  "page-corpus",
  "feed-corpus",
  "upsert-plan",
  "upsert-verdicts",
  "candidates-recall",
  "recall-seam",
  "metrics",
  "audit-verdict",
  "event-ledger",
  "run-outcomes",
  "link-inventory",
  "eval-synthesis",
  "product-contract",
]
release = [
  "skill-contract",
  "validate-smoke",
  "runtime-eval",
  "pytest",
  "live-gate",
  "retired-sources",
  "invariants-shape",
  "workflow-refs",
  "page-corpus",
  "feed-corpus",
  "upsert-plan",
  "upsert-verdicts",
  "candidates-recall",
  "recall-seam",
  "metrics",
  "audit-verdict",
  "event-ledger",
  "run-outcomes",
  "link-inventory",
  "eval-synthesis",
  "link-gate",
  "version-sync",
  "product-contract",
]
